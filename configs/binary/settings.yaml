task_type: binary
output_root_dir: ../../output/Binary
output_name_files: {html: dashboard_binary.html, xlsx: report_binary.xlsx}
positive_if_higher_score: true
positive_label: 1
negative_label: 0
custom_threshold: 0.5
operational_reference_rates: [0.1, 0.01, 0.001]
axes_scale: linear
threshold_grid: {start: 0.0, end: 1.0, step: 0.05}
language: en
decimals: 2
ui: {plotly_delivery: inline}
case_study: generic
statistics:
  group_audit_min_samples: 20
  confidence_intervals: {enabled: true, level: 0.95, method: bca, n_resamples: 2000, seed: 42, resample_unit: sample}
worst_case: {enabled: true, metric: far, min_samples: 20}
